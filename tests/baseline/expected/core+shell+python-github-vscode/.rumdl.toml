# rumdl configuration — markdown linting.

respect-gitignore = true

exclude = ["node_modules/**", ".git/**"]

# Rules that need project-specific data or a document template to be useful.
disable = [
  "MD043", # required heading structure (needs a template)
  "MD044", # proper names capitalization (needs a names list)
  "MD060", # table column alignment
  "MD061", # forbidden terms (needs a term list)
  "MD073", # TOC matches document headings (needs a TOC)
]

[MD013]
line_length = 120
code_blocks = false
tables = false

# Issue, PR and MR templates are bodies pasted under the host's own title, so
# they start at `##`, not with a level-1 heading. Patterns for the host you did
# not render match nothing.
[per-file-ignores]
".github/ISSUE_TEMPLATE/*.md" = ["MD041"]
".github/pull_request_template.md" = ["MD041"]
".gitlab/issue_templates/*.md" = ["MD041"]
".gitlab/merge_request_templates/*.md" = ["MD041"]
