name: Catalog scanner

# Requires the SCANNER_TOKEN repo secret (#401). Pushes and PRs made with
# the default GITHUB_TOKEN don't trigger other workflows, so scan PRs sat
# in `action_required` with no validate run. SCANNER_TOKEN is a
# fine-grained PAT or GitHub App token, this repo only, with
# contents:write, pull-requests:write, and issues:write (the scanner
# files tracking issues via `gh`). See docs/scanner.md#scanner_token-secret.
#
# Three jobs, so third-party code never runs where the secret is (#416):
# `build` compiles the scanner (cargo only, no npm). `stage` runs that
# binary's adapters and validates the generated files with ajv, with no
# secret and no cargo cache. `deliver` runs only the prebuilt binary,
# `gh`, and `git`, and is the one job that sees SCANNER_TOKEN. It checks
# the binary against the sha256 `build` publishes before running it
# (#427). Dry runs stop after `stage`.

on:
  schedule:
    # Hourly — per-tool gating is done in scanner code via
    # `activity.scan_cadence_days`, so cheap tools won't actually be
    # scanned every hour.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      tool:
        description: "Force-scan a single tool id (skips cadence). Empty = scan all due tools."
        required: false
        type: string
      dry_run:
        description: "Print plan but don't write files or open PRs/issues"
        required: false
        type: boolean
        default: false
      backfill_from:
        description: "With `tool`: backfill releases from this version up to the oldest cataloged one (e.g. 1.82.0) instead of scanning forward."
        required: false
        type: string

# Every write goes through SCANNER_TOKEN. GITHUB_TOKEN only fetches this
# public repo and makes the adapters' read-only API calls (#416).
permissions:
  contents: read

concurrency:
  # Serialize scans so a long-running scan doesn't race with the next
  # hourly trigger. `cancel-in-progress: false` means a slow scan
  # finishes; the next cron tick queues behind it.
  group: catalog-scanner
  cancel-in-progress: false

jobs:
  build:
    # Compiles the scanner that `deliver` later runs with the token. No
    # secret, and no npm/node: the rust-cache saved from this job's target/
    # was only ever written by cargo, so ajv's JS in `stage` has no path
    # into a later run's build (#416). Build scripts and proc-macros of the
    # locked dependencies still run here.
    name: Build scanner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      # `deliver` checks the binary it downloads against this (#427).
      scanner_sha256: ${{ steps.hash.outputs.sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .

      - name: Build scanner
        run: cargo build --release --locked -p scanner

      - name: Hash scanner binary
        # Job outputs are set by this job alone, so `stage` (which holds
        # the run's artifact token) can't change the hash `deliver` checks.
        id: hash
        run: |
          set -euo pipefail
          sha256=$(sha256sum target/release/scanner | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload scanner binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scanner
          path: target/release/scanner
          if-no-files-found: error
          retention-days: 1

  stage:
    # No secret is referenced here. npm packages and ajv run in this job,
    # which has no cargo cache and no token (#416).
    name: Scan and validate
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download scanner binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scanner
          # Outside the checkout, so it never shows up as an untracked
          # file to the scanner's own git calls.
          path: ${{ runner.temp }}/scanner-bin

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install ajv-cli
        # Mirror the version pins from validate.yml so the scanner's
        # ajv gate matches the PR validation gate exactly. ajv-cli and
        # ajv-formats are plain JS and need no install scripts.
        run: npm install --no-save --ignore-scripts ajv-cli@5.0.0 ajv-formats@3.0.1

      - name: Run scanner
        # Inputs are piped via env to avoid GitHub Actions expression
        # injection — see
        # https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/
        env:
          # Read-only GitHub API calls from adapters (rate limit).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TOOL: ${{ inputs.tool }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_BACKFILL_FROM: ${{ inputs.backfill_from }}
          PLAN: ${{ runner.temp }}/plan/plan.json
          SCANNER_BIN: ${{ runner.temp }}/scanner-bin/scanner
        run: |
          set -euo pipefail
          # The artifact round-trip drops the executable bit.
          chmod +x "$SCANNER_BIN"
          mkdir -p "$(dirname "$PLAN")"
          # A dry run prints its plan and stops; anything else writes the
          # validated changes to $PLAN for `deliver`.
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            mode=(--dry-run)
          else
            mode=(--stage "$PLAN")
          fi
          if [ -n "$INPUT_BACKFILL_FROM" ]; then
            if [ -z "$INPUT_TOOL" ]; then
              echo "::error::backfill_from requires tool" >&2
              exit 1
            fi
            "$SCANNER_BIN" backfill "$INPUT_TOOL" --from "$INPUT_BACKFILL_FROM" "${mode[@]}"
          elif [ -n "$INPUT_TOOL" ]; then
            "$SCANNER_BIN" tool "$INPUT_TOOL" "${mode[@]}"
          else
            "$SCANNER_BIN" due "${mode[@]}"
          fi

      - name: Upload plan
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan
          path: ${{ runner.temp }}/plan/plan.json
          if-no-files-found: error
          retention-days: 1

  deliver:
    # The only job with SCANNER_TOKEN. It runs the scanner binary built in
    # `build`, `gh`, and `git` — no npm, node, ajv, or cargo (#416).
    # Dry runs make no writes and skip it. A scheduled run has no inputs,
    # so `inputs.dry_run` is null there and this job still runs.
    name: Open scan PRs
    needs: [build, stage]
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Require SCANNER_TOKEN
        # Fail with a clear message rather than at the first push or `gh`
        # call.
        env:
          SCANNER_TOKEN: ${{ secrets.SCANNER_TOKEN }}
        run: |
          if [ -z "$SCANNER_TOKEN" ]; then
            echo "::error::SCANNER_TOKEN secret is not set. Add a fine-grained PAT or GitHub App token scoped to this repo with contents:write, pull-requests:write, and issues:write (see docs/scanner.md#scanner_token-secret)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history needed because the scanner creates branches
          # and pushes commits back via `git`. Same commit as `stage`
          # (`github.sha`); `scanner deliver` refuses any other.
          fetch-depth: 0
          # Fetch with the default read-only token and leave no
          # credential in .git/config (#416). `Deliver` supplies push
          # auth through git's command-line config.
          persist-credentials: false

      - name: Configure git identity
        # Required for the scanner's `git commit` step. The bot identity
        # makes scan-authored commits distinguishable from human ones.
        run: |
          git config user.name "containers-db scanner"
          git config user.email "containers-db-scanner@users.noreply.github.com"

      # Each artifact is downloaded by name into its own directory, so
      # nothing else in the run lands next to the binary (#427). Both
      # directories are outside the checkout, so neither shows up as an
      # untracked file to the scanner's own git calls.
      - name: Download scanner binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scanner
          path: ${{ runner.temp }}/scanner-bin

      - name: Download plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan
          path: ${{ runner.temp }}/plan

      - name: Deliver
        env:
          # `gh` prefers GH_TOKEN, so PRs/issues are opened as this
          # identity and their pushes trigger validate.yml (#401).
          GH_TOKEN: ${{ secrets.SCANNER_TOKEN }}
          SCANNER_BIN: ${{ runner.temp }}/scanner-bin/scanner
          SCANNER_SHA256: ${{ needs.build.outputs.scanner_sha256 }}
          PLAN: ${{ runner.temp }}/plan/plan.json
          # Command-line git config, which overrides every config file.
          # The empty helper clears any helper list read from disk, so
          # `git push` hands GH_TOKEN only to gh. Hooks and fsmonitor are
          # off. Hardening only: nothing third-party runs in this job.
          GIT_CONFIG_COUNT: "4"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ""
          GIT_CONFIG_KEY_1: credential.helper
          GIT_CONFIG_VALUE_1: "!gh auth git-credential"
          GIT_CONFIG_KEY_2: core.hooksPath
          GIT_CONFIG_VALUE_2: /dev/null
          GIT_CONFIG_KEY_3: core.fsmonitor
          GIT_CONFIG_VALUE_3: "false"
        run: |
          set -euo pipefail
          # Run only the binary `build` hashed (#427). An empty or
          # malformed hash means the job output is miswired, not a match.
          if ! [[ "$SCANNER_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            # The value itself is not echoed: it is not a hash, so it could
            # carry a newline and start a workflow command.
            echo "::error::build did not publish a valid scanner sha256." >&2
            exit 1
          fi
          if ! printf '%s  %s\n' "$SCANNER_SHA256" "$SCANNER_BIN" \
              | sha256sum --check --strict --quiet -; then
            echo "::error::Scanner binary does not match the sha256 build published; refusing to run it." >&2
            exit 1
          fi
          # The artifact round-trip drops the executable bit.
          chmod +x "$SCANNER_BIN"
          "$SCANNER_BIN" deliver --plan "$PLAN"
