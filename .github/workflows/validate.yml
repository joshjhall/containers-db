name: Validate schemas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-schemas:
    name: ajv + Rust validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Install ajv-cli
        # Exact install from the committed package-lock.json, which pins
        # ajv-cli, ajv-formats, and every transitive dependency. They are
        # plain JS and need no install scripts.
        run: npm ci --ignore-scripts

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: .

      - name: Compile tool schema
        run: |
          npx --no-install ajv compile \
            --spec=draft2020 \
            -c ajv-formats \
            -s schema/tool.schema.json

      - name: Compile version schema
        run: |
          npx --no-install ajv compile \
            --spec=draft2020 \
            -c ajv-formats \
            -s schema/version.schema.json

      - name: Validate sample-tool index against tool schema
        run: |
          npx --no-install ajv validate \
            --spec=draft2020 \
            -c ajv-formats \
            -s schema/tool.schema.json \
            -d fixtures/sample-tool/index.json

      - name: Validate sample-tool versions against version schema
        run: |
          npx --no-install ajv validate \
            --spec=draft2020 \
            -c ajv-formats \
            -s schema/version.schema.json \
            -d "fixtures/sample-tool/versions/*.json"

      - name: Validate rust tool index against tool schema
        run: |
          npx --no-install ajv validate \
            --spec=draft2020 \
            -c ajv-formats \
            -s schema/tool.schema.json \
            -d tools/rust/index.json

      - name: Validate system_package tool indexes against tool schema
        run: |
          npx --no-install ajv validate \
            --spec=draft2020 \
            -c ajv-formats \
            -s schema/tool.schema.json \
            -d "tools/gcc/index.json" \
            -d "tools/libc_dev/index.json" \
            -d "tools/musl_dev/index.json" \
            -d "tools/ca_certificates/index.json" \
            -d "tools/gnupg/index.json" \
            -d "tools/libatomic/index.json"

      - name: Validate rust version files against version schema
        run: |
          npx --no-install ajv validate \
            --spec=draft2020 \
            -c ajv-formats \
            -s schema/version.schema.json \
            -d "tools/rust/versions/*.json"

      - name: Validate go tool index against tool schema
        run: |
          npx --no-install ajv validate \
            --spec=draft2020 \
            -c ajv-formats \
            -s schema/tool.schema.json \
            -d tools/go/index.json

      - name: Validate go version files against version schema
        run: |
          npx --no-install ajv validate \
            --spec=draft2020 \
            -c ajv-formats \
            -s schema/version.schema.json \
            -d "tools/go/versions/*.json"

      - name: Validate node tool index against tool schema
        run: |
          npx --no-install ajv validate \
            --spec=draft2020 \
            -c ajv-formats \
            -s schema/tool.schema.json \
            -d tools/node/index.json

      - name: Validate node version files against version schema
        run: |
          npx --no-install ajv validate \
            --spec=draft2020 \
            -c ajv-formats \
            -s schema/version.schema.json \
            -d "tools/node/versions/*.json"

      - name: Validate tier example fixtures against version schema
        run: |
          npx --no-install ajv validate \
            --spec=draft2020 \
            -c ajv-formats \
            -s schema/version.schema.json \
            -d "fixtures/tier*-example.json"

      - name: Rust format check
        run: cargo fmt --all --check

      # Floats with `stable`, so a new lint can fail a PR that touched no Rust.
      # That is intended: it surfaces here rather than only on a contributor's
      # newer local toolchain.
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build workspace (validator + scanner)
        run: cargo build --release --workspace

      - name: Workspace unit + integration tests
        run: cargo test --release --workspace

      - name: Semantic validation (full catalog walk)
        run: cargo run --release -p db-validator --bin validate-catalog

      - name: Lint scanner sha256 gate
        run: shellcheck bin/verify-scanner.sh tests/verify-scanner.test.sh

      - name: Test scanner sha256 gate reject paths
        # scan.yml's deliver job runs this gate before the scanner gets
        # SCANNER_TOKEN; real runs only ever take the matching path (#436).
        run: tests/verify-scanner.test.sh

      - name: Lint tested[] dedupe script
        run: shellcheck bin/dedupe-tested.sh tests/dedupe-tested.test.sh

      - name: Test tested[] dedupe script
        # One-off cleanup for evidence re-test repeats (#450); keeps the
        # mixed-result guard and the triple-set invariant pinned.
        run: tests/dedupe-tested.test.sh

      - name: Negative test — broken fixtures must each fail validation
        run: |
          set -e
          VALIDATOR=target/release/validate-catalog
          for fixture in fixtures/_negative/*.json; do
            ajv_rc=0
            sem_rc=0
            set +e
            npx --no-install ajv validate \
              --spec=draft2020 \
              -c ajv-formats \
              -s schema/version.schema.json \
              -d "$fixture"
            ajv_rc=$?
            "$VALIDATOR" --only "$fixture"
            sem_rc=$?
            set -e
            if [ "$ajv_rc" -eq 0 ] && [ "$sem_rc" -eq 0 ]; then
              echo "::error::Negative fixture $fixture passed both ajv AND validate-catalog — schema/validator is too permissive"
              exit 1
            fi
            echo "Negative fixture $fixture correctly rejected (ajv=$ajv_rc, validate-catalog=$sem_rc)"
          done

      # Tool-index counterpart of the loop above. These fixtures break a
      # tool.schema.json rule (e.g. `version_args` minItems / item minLength)
      # that has no semantic-validator twin, so only ajv is consulted.
      #
      # A non-zero ajv exit alone proves nothing: a fixture broken for an
      # unrelated reason would pass too. So each `<name>.json` has a
      # `<name>.expect` sidecar:
      #   { "instancePath": ..., "keyword": ..., "repair": { ... } }
      # The step requires that (1) ajv rejects the fixture, (2) ajv reports an
      # error at exactly that instancePath with that keyword, and (3) the
      # fixture with `repair` merged in is accepted. (3) is the positive
      # control: it proves the targeted rule is the fixture's only defect.
      - name: Negative test — broken tool-index fixtures must each fail validation
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          for fixture in fixtures/_negative_tool/*.json; do
            # An unmatched glob leaves the literal pattern, which ajv would
            # "reject" as a missing file and so pass vacuously.
            if [ ! -f "$fixture" ]; then
              echo "::error::No tool-index negative fixtures found at $fixture"
              exit 1
            fi
            expect="${fixture%.json}.expect"
            if [ ! -f "$expect" ]; then
              echo "::error::Negative tool fixture $fixture has no $expect naming the rule it targets"
              exit 1
            fi
            want_path=$(jq -er '.instancePath | strings' "$expect")
            want_keyword=$(jq -er '.keyword | strings | select(length > 0)' "$expect")
            jq -e '.repair | objects' "$expect" > /dev/null

            # (1) + (2): rejected, and for the declared reason. ajv-cli prints
            # "<file> invalid" then the error array (--errors=json) on stderr.
            # --all-errors keeps the targeted error from being masked by an
            # earlier one; extra defects are the positive control's job.
            ajv_rc=0
            npx --no-install ajv validate \
              --spec=draft2020 \
              -c ajv-formats \
              --all-errors \
              -s schema/tool.schema.json \
              -d "$fixture" \
              --errors=json 2> "$scratch/stderr" || ajv_rc=$?
            if [ "$ajv_rc" -eq 0 ]; then
              echo "::error::Negative tool fixture $fixture passed ajv — tool schema is too permissive"
              exit 1
            fi
            if ! tail -n +2 "$scratch/stderr" \
              | jq -e --arg p "$want_path" --arg k "$want_keyword" \
                  'any(.[]; .instancePath == $p and .keyword == $k)' > /dev/null; then
              echo "::error::Negative tool fixture $fixture was rejected, but not by $want_keyword at $want_path:"
              cat "$scratch/stderr"
              exit 1
            fi

            # (3) Positive control: the repaired fixture must validate.
            jq --slurpfile e "$expect" '. * $e[0].repair' "$fixture" > "$scratch/repaired.json"
            if ! npx --no-install ajv validate \
              --spec=draft2020 \
              -c ajv-formats \
              -s schema/tool.schema.json \
              -d "$scratch/repaired.json"; then
              echo "::error::Positive control failed: $fixture with its repair applied is still invalid, so it is broken by more than $want_keyword at $want_path"
              exit 1
            fi
            echo "Negative tool fixture $fixture rejected by $want_keyword at $want_path; repaired twin accepted"
          done

  # The job above floats on `stable`, which only ever moves past the declared
  # minimum. This job builds on exactly `rust-version`, so a newer-than-MSRV
  # API or a dependency raising its own MSRV fails here instead of quietly
  # invalidating the floor.
  msrv:
    name: MSRV check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bootstrap toolchain, only to let cargo read the manifest below.
      - name: Set up Rust (stable, for cargo metadata)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      # Ask cargo for rust-version rather than parsing TOML by hand. Every
      # workspace member inherits it, so exactly one distinct value is required.
      - name: Read rust-version
        id: msrv
        run: |
          versions=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[].rust_version] | unique | .[]')
          if [ "$(printf '%s\n' "$versions" | grep -c .)" -ne 1 ] || [ "$versions" = null ]; then
            echo "::error::expected one workspace rust-version, got: ${versions:-none}"
            exit 1
          fi
          echo "version=$versions" >> "$GITHUB_OUTPUT"

      - name: Set up Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: .

      - name: Check workspace on MSRV
        run: cargo check --workspace --all-targets --locked
