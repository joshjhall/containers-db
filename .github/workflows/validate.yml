name: Validate schemas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same PR so stale heads stop holding runners.
# Non-PR runs (main pushes, manual dispatch) get a unique group via run_id:
# a shared group would let a newer queued run replace a pending one even with
# cancel-in-progress false, and main runs must never be cancelled.
concurrency:
  group: validate-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-schemas:
    name: ajv + Rust validate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Install ajv-cli
        # Exact install from the committed package-lock.json, which pins
        # ajv-cli, ajv-formats, and every transitive dependency. They are
        # plain JS and need no install scripts.
        run: npm ci --ignore-scripts

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: .

      - name: Compile tool schema
        run: |
          npx --no-install ajv compile \
            --spec=draft2020 \
            -c ajv-formats \
            -s schema/tool.schema.json

      - name: Compile version schema
        run: |
          npx --no-install ajv compile \
            --spec=draft2020 \
            -c ajv-formats \
            -s schema/version.schema.json

      - name: Validate sample-tool index against tool schema
        run: |
          npx --no-install ajv validate \
            --spec=draft2020 \
            -c ajv-formats \
            -s schema/tool.schema.json \
            -d fixtures/sample-tool/index.json

      - name: Validate sample-tool versions against version schema
        run: |
          npx --no-install ajv validate \
            --spec=draft2020 \
            -c ajv-formats \
            -s schema/version.schema.json \
            -d "fixtures/sample-tool/versions/*.json"

      - name: Validate every tool index against tool schema
        # One glob instead of a hand-kept list: a new tools/<name>/ dir is
        # covered without editing this workflow (#487). The glob silently skips
        # a tools/<name>/ dir with no index.json, so name every such dir first
        # (#494). ajv-cli exits 0 on a glob that matches nothing, so refuse an
        # empty match too, then hand ajv the same checked expansion.
        run: |
          set -euo pipefail
          shopt -s nullglob
          missing=0
          for dir in tools/*/; do
            if [ ! -f "${dir}index.json" ]; then
              echo "::error::${dir%/} has no index.json"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          indexes=(tools/*/index.json)
          if [ "${#indexes[@]}" -eq 0 ]; then
            echo "::error::No tools/*/index.json found — glob validated nothing"
            exit 1
          fi
          data_args=()
          for f in "${indexes[@]}"; do
            data_args+=(-d "$f")
          done
          npx --no-install ajv validate \
            --spec=draft2020 \
            -c ajv-formats \
            -s schema/tool.schema.json \
            "${data_args[@]}"

      - name: Validate every tool version file against version schema
        # One glob, like the index step above: a new tools/<name>/versions/
        # is covered without editing this workflow (#623 added 14 tools whose
        # version files the old per-tool rust/go/node steps never checked).
        # system_package tools have no versions/, so require only a non-empty
        # total match rather than one per dir.
        run: |
          set -euo pipefail
          shopt -s nullglob
          versions=(tools/*/versions/*.json)
          if [ "${#versions[@]}" -eq 0 ]; then
            echo "::error::No tools/*/versions/*.json found — glob validated nothing"
            exit 1
          fi
          data_args=()
          for f in "${versions[@]}"; do
            data_args+=(-d "$f")
          done
          npx --no-install ajv validate \
            --spec=draft2020 \
            -c ajv-formats \
            -s schema/version.schema.json \
            "${data_args[@]}"

      - name: Validate tier example fixtures against version schema
        run: |
          npx --no-install ajv validate \
            --spec=draft2020 \
            -c ajv-formats \
            -s schema/version.schema.json \
            -d "fixtures/tier*-example.json"

      - name: Rust format check
        run: cargo fmt --all --check

      # Floats with `stable`, so a new lint can fail a PR that touched no Rust.
      # That is intended: it surfaces here rather than only on a contributor's
      # newer local toolchain.
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build workspace (validator + scanner)
        run: cargo build --release --workspace

      - name: Workspace unit + integration tests
        run: cargo test --release --workspace

      - name: Semantic validation (full catalog walk)
        run: cargo run --release -p db-validator --bin validate-catalog

      - name: Lint scanner sha256 gate
        run: shellcheck bin/verify-scanner.sh tests/verify-scanner.test.sh

      - name: Test scanner sha256 gate reject paths
        # scan.yml's deliver job runs this gate before the scanner gets
        # SCANNER_TOKEN; real runs only ever take the matching path (#436).
        run: tests/verify-scanner.test.sh

      - name: Lint tested[] dedupe script
        run: shellcheck bin/dedupe-tested.sh tests/dedupe-tested.test.sh

      - name: Test tested[] dedupe script
        # One-off cleanup for evidence re-test repeats (#450); keeps the
        # mixed-result guard and the triple-set invariant pinned.
        run: tests/dedupe-tested.test.sh

      - name: Lint baseline pin generator
        run: shellcheck bin/baseline-pins.sh tests/baseline-pins.test.sh

      - name: Test baseline pin generator
        # Drift, write-path and refusal cases, each on a scratch copy (#623).
        run: tests/baseline-pins.test.sh

      - name: Baseline pins match the catalog
        # The repo-baseline tools.versions / tools.sha256 / ruff+uv
        # required-version are generated from tools/<id>/. A hand edit to a
        # pin file, or a catalog change that was not regenerated, fails here.
        run: bin/baseline-pins.sh --check

      - name: Negative test — broken fixtures must each fail validation
        run: |
          set -e
          VALIDATOR=target/release/validate-catalog
          for fixture in fixtures/_negative/*.json; do
            ajv_rc=0
            sem_rc=0
            set +e
            npx --no-install ajv validate \
              --spec=draft2020 \
              -c ajv-formats \
              -s schema/version.schema.json \
              -d "$fixture"
            ajv_rc=$?
            "$VALIDATOR" --only "$fixture"
            sem_rc=$?
            set -e
            if [ "$ajv_rc" -eq 0 ] && [ "$sem_rc" -eq 0 ]; then
              echo "::error::Negative fixture $fixture passed both ajv AND validate-catalog — schema/validator is too permissive"
              exit 1
            fi
            echo "Negative fixture $fixture correctly rejected (ajv=$ajv_rc, validate-catalog=$sem_rc)"
          done

      # Tool-index counterpart of the loop above. These fixtures break a
      # tool.schema.json rule (e.g. `version_args` minItems / item minLength)
      # that has no semantic-validator twin, so only ajv is consulted.
      #
      # A non-zero ajv exit alone proves nothing: a fixture broken for an
      # unrelated reason would pass too. So each `<name>.json` has a
      # `<name>.expect` sidecar:
      #   { "instancePath": ..., "keyword": ..., "repair": { ... } }
      # The step requires that (1) ajv rejects the fixture, (2) ajv reports an
      # error at exactly that instancePath with that keyword, and (3) the
      # fixture with `repair` merged in is accepted. (3) is the positive
      # control: it proves the targeted rule is the fixture's only defect.
      - name: Negative test — broken tool-index fixtures must each fail validation
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          for fixture in fixtures/_negative_tool/*.json; do
            # An unmatched glob leaves the literal pattern, which ajv would
            # "reject" as a missing file and so pass vacuously.
            if [ ! -f "$fixture" ]; then
              echo "::error::No tool-index negative fixtures found at $fixture"
              exit 1
            fi
            expect="${fixture%.json}.expect"
            if [ ! -f "$expect" ]; then
              echo "::error::Negative tool fixture $fixture has no $expect naming the rule it targets"
              exit 1
            fi
            want_path=$(jq -er '.instancePath | strings' "$expect")
            want_keyword=$(jq -er '.keyword | strings | select(length > 0)' "$expect")
            jq -e '.repair | objects' "$expect" > /dev/null

            # (1) + (2): rejected, and for the declared reason. ajv-cli prints
            # "<file> invalid" then the error array (--errors=json) on stderr.
            # --all-errors keeps the targeted error from being masked by an
            # earlier one; extra defects are the positive control's job.
            ajv_rc=0
            npx --no-install ajv validate \
              --spec=draft2020 \
              -c ajv-formats \
              --all-errors \
              -s schema/tool.schema.json \
              -d "$fixture" \
              --errors=json 2> "$scratch/stderr" || ajv_rc=$?
            if [ "$ajv_rc" -eq 0 ]; then
              echo "::error::Negative tool fixture $fixture passed ajv — tool schema is too permissive"
              exit 1
            fi
            if ! tail -n +2 "$scratch/stderr" \
              | jq -e --arg p "$want_path" --arg k "$want_keyword" \
                  'any(.[]; .instancePath == $p and .keyword == $k)' > /dev/null; then
              echo "::error::Negative tool fixture $fixture was rejected, but not by $want_keyword at $want_path:"
              cat "$scratch/stderr"
              exit 1
            fi

            # (3) Positive control: the repaired fixture must validate.
            jq --slurpfile e "$expect" '. * $e[0].repair' "$fixture" > "$scratch/repaired.json"
            if ! npx --no-install ajv validate \
              --spec=draft2020 \
              -c ajv-formats \
              -s schema/tool.schema.json \
              -d "$scratch/repaired.json"; then
              echo "::error::Positive control failed: $fixture with its repair applied is still invalid, so it is broken by more than $want_keyword at $want_path"
              exit 1
            fi
            echo "Negative tool fixture $fixture rejected by $want_keyword at $want_path; repaired twin accepted"
          done

  # Repo-baseline templates moved from librarian (#558). Tools come from the
  # templates' own installer and pins, and BASELINE_REQUIRE_TOOLS=1 turns a
  # missing-tool skip into a failure so the gates cannot pass on skips alone.
  baseline:
    name: Repo-baseline gates
    runs-on: ubuntu-24.04
    env:
      BASELINE_REQUIRE_TOOLS: "1"
      TOOLS_BIN: ${{ github.workspace }}/.tools/bin

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned baseline tools
        # The installer appends TOOLS_BIN to GITHUB_PATH, so later steps use
        # the pinned binaries ahead of the runner's own.
        run: tests/baseline/install-tools.sh

      - name: Lint baseline scripts
        run: >-
          shellcheck -x --severity=warning baseline/templates/render.sh
          tests/baseline/install-tools.sh
          tests/baseline/render-parity.test.sh tests/baseline/validate-slices.sh
          tests/baseline/validate-templates.sh
          tests/baseline/hook-just-gate.sh tests/baseline/hook-just-gate.test.sh
          tests/baseline/render-modes.test.sh tests/baseline/editor-config.test.sh
          tests/baseline/validate-platform.sh
          tests/baseline/validate-platform-mutations.test.sh

      - name: Slice contract conformance
        run: bash tests/baseline/validate-slices.sh

      - name: Template gate (manifest, fence parity, rendered-repo hooks)
        run: bash tests/baseline/validate-templates.sh

      - name: Hook-just gate (lefthook → just → tool)
        run: tests/baseline/hook-just-gate.test.sh

      - name: Render parity against goldens
        run: tests/baseline/render-parity.test.sh

      - name: Render modes (create-only stubs, AGENTS.md symlink)
        run: tests/baseline/render-modes.test.sh

      - name: Editor config (IDE selection, formatter-flag parity)
        run: tests/baseline/editor-config.test.sh

      - name: Platform settings spec (merge-gate, labels)
        run: tests/baseline/validate-platform.sh

      - name: Platform gate mutation self-test
        run: tests/baseline/validate-platform-mutations.test.sh

  # The job above floats on `stable`, which only ever moves past the declared
  # minimum. This job builds on exactly `rust-version`, so a newer-than-MSRV
  # API or a dependency raising its own MSRV fails here instead of quietly
  # invalidating the floor.
  msrv:
    name: MSRV check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bootstrap toolchain, only to let cargo read the manifest below.
      - name: Set up Rust (stable, for cargo metadata)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      # Ask cargo for rust-version rather than parsing TOML by hand. Every
      # workspace member inherits it, so exactly one distinct value is required.
      - name: Read rust-version
        id: msrv
        run: |
          versions=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[].rust_version] | unique | .[]')
          if [ "$(printf '%s\n' "$versions" | grep -c .)" -ne 1 ] || [ "$versions" = null ]; then
            echo "::error::expected one workspace rust-version, got: ${versions:-none}"
            exit 1
          fi
          echo "version=$versions" >> "$GITHUB_OUTPUT"

      - name: Set up Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: .

      - name: Check workspace on MSRV
        run: cargo check --workspace --all-targets --locked
